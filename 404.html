<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falak Tulsi</title>
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        var previewMatch = target.match(/^(\/pr-preview\/pr-\d+\/)/);
        var base = previewMatch ? previewMatch[1] : '/';
        window.location.replace(base + '?redirect=' + encodeURIComponent(target));
      })();
    </script>
  </head>
  <body></body>
</html>
