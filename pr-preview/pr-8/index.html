    <script>
      (function () {
        try {
          var saved = localStorage.getItem("selectedPalette");
          if (!saved) return;
          var palette = JSON.parse(saved);
          var root = document.documentElement.style;
          if (palette.primary) root.setProperty("--primary", palette.primary);
          if (palette.secondary) root.setProperty("--secondary", palette.secondary);
          if (palette["primary-dark"]) root.setProperty("--primary-dark", palette["primary-dark"]);
          if (palette["secondary-dark"]) root.setProperty("--secondary-dark", palette["secondary-dark"]);
        } catch (e) {}
      })();
    </script>
